[project]
name = "aletheia"
version = "0.1.0"
description = "AIGC text detector API service"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "fastapi>=0.133.1",
    "lingua-language-detector>=2.1.1",
    "onnxruntime>=1.20.0",
    "scipy>=1.12.0",
    "transformers>=5.1.0",
    "uvicorn[standard]>=0.41.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "typesafe-sdk>=0.7.1",
]

[tool.uv]
environments = [
    "python_version >= '3.12' and python_version < '3.14' and sys_platform != 'emscripten'",
]

[dependency-groups]
dev = [
    "datasets>=3.0.0",
    "optimum>=2.0.0",
    "pandas>=2.0.0",
]
