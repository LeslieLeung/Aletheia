<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>Aletheia</h1>
    <label class="toggle">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>
  <p class="sub" data-i18n="appSubtitle">AI Text Detector</p>

  <div class="section">
    <label for="apiUrl" data-i18n="apiUrl">API URL</label>
    <input type="text" id="apiUrl" placeholder="http://localhost:8000">
  </div>

  <div class="section">
    <label for="detector" data-i18n="aiDetector">AI detector</label>
    <select id="detector">
      <option value="onnx_classifier">AIGC Detector</option>
      <option value="diveye">DivEye</option>
      <option value="jev">Jev</option>
    </select>
  </div>

  <div class="section">
    <label for="contentEngine" data-i18n="contentType">Content type</label>
    <select id="contentEngine">
      <option value="off" data-i18n="off">Off</option>
      <option value="jev">Jev</option>
    </select>
  </div>

  <button id="detectBtn" data-i18n="detectNow">Detect Now</button>

  <div id="status" class="status"></div>

  <div class="footer">
    <a href="#" id="optionsLink" data-i18n="settings">Settings</a>
  </div>

  <script src="../shared/constants.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
