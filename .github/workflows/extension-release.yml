name: Package extension

on:
  push:
    tags: ["v*"]

jobs:
  package-extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check versions
        run: python3 scripts/sync-version.py --check --tag "${{ github.ref_name }}"

      - name: Sign extension
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "Add AMO_API_KEY and AMO_API_SECRET to the repository secrets."
            exit 1
          fi
          npx --yes web-ext sign \
            --channel=unlisted \
            --source-dir extension \
            --artifacts-dir web-ext-artifacts
          xpi="$(find web-ext-artifacts -name '*.xpi' -print -quit)"
          test -n "$xpi"
          mv "$xpi" "aletheia-extension-${{ github.ref_name }}.xpi"

      - name: Package extension
        run: |
          cd extension
          zip -r ../aletheia-extension-${{ github.ref_name }}.zip . \
            -x ".*"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aletheia-extension-${{ github.ref_name }}.zip
            aletheia-extension-${{ github.ref_name }}.xpi
